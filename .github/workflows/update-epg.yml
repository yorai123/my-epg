name: Update EPG
on:
  schedule:
    - cron: "30 */6 * * *"   # every 6 hours
  workflow_dispatch:        # lets you run it by hand
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python filter_epg.py
      - run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg.xml.gz report.txt extra_channels.txt
          git commit -m "update epg" || echo "no changes"
          git push
